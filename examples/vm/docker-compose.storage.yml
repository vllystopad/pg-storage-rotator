# Generated by storage:generate for profile vm; do not edit.
# Change the env file and run: npm run storage:generate -- --env .env.local
# Bundled PostgreSQL: docker compose --env-file .env.local -f docker-compose.storage.yml --profile demo up -d --build
# To use your own database, leave out --profile demo and point DATABASE_URL at it.

services:
  postgres:
    profiles:
      - demo
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    image: pg-storage-rotator-postgres-18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_WALDIR: /mnt/pg/wal
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - pg_data:/var/lib/postgresql
      - pg_warm:/mnt/pg/warm
      - pg_wal:/mnt/pg/wal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
volumes:
  pg_data: {}
  pg_warm: {}
  pg_wal: {}
